{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - BRAC University Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
      body { font-family: 'Poppins', sans-serif; background: #f5f7fb; margin: 0; }
      .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; position: relative; overflow: hidden; background: linear-gradient(180deg, #f5f7fb 0%, #eef2f7 100%); }
      .login-page::before {
        content: '';
        position: absolute;
        top: 0;
        left: 50%;
        width: 1100px;
        height: 1100px;
        transform: translateX(-50%) translateY(-22%);
        background: radial-gradient(circle at 30% 30%, rgba(59, 130, 246, .08), transparent 23%), radial-gradient(circle at 70% 70%, rgba(59, 130, 246, .07), transparent 18%);
        opacity: .8;
        pointer-events: none;
      }
      .login-card { width: 100%; max-width: 480px; border: none; border-radius: 30px; box-shadow: 0 28px 70px rgba(15, 23, 42, .08); background: #ffffff; position: relative; z-index: 1; }
      .login-card .card-body { padding: 2.5rem 2.3rem 2rem; }
      .login-brand { text-align: center; margin-bottom: 1.85rem; }
      .login-brand .brand-logo { width: 82px; height: 82px; display: inline-block; margin-bottom: 1rem; }
      .login-brand h4 { margin-bottom: .35rem; font-size: 1.6rem; font-weight: 700; color: #0f172a; letter-spacing: -.02em; }
      .login-brand p { margin-bottom: 0; color: #6b7280; font-size: 1rem; }
      .form-label { font-weight: 600; color: #1f2937; }
      .form-control { border-radius: 16px; padding: 1rem 1rem; border: 1px solid rgba(148, 163, 184, .2); background: #f8fafc; }
      .form-control:focus { border-color: #4f7dff; box-shadow: 0 0 0 0.15rem rgba(79, 125, 255, .16); background: #fff; }
      .forgot-link { color: #2563eb; text-decoration: none; font-size: .95rem; }
      .btn-google { background: #ffffff; color: #111827; border: 1px solid rgba(15, 23, 42, .12); border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; gap: .75rem; padding: 0.95rem 1rem; font-weight: 600; transition: background .15s; }
      .btn-google:hover { background: #f8fafc; }
      .btn-primary { background: #4487ff; border-color: #4487ff; border-radius: 16px; font-weight: 700; padding: 0.95rem 1rem; }
      .btn-primary:hover, .btn-primary:focus { background: #3b6ee6; border-color: #3b6ee6; }
      .login-divider { text-align: center; margin: 1.5rem 0; position: relative; }
      .login-divider::before, .login-divider::after { content: ''; height: 1px; width: 42%; background: rgba(148, 163, 184, .28); position: absolute; top: 50%; }
      .login-divider::before { left: 0; }
      .login-divider::after { right: 0; }
      .login-divider span { display: inline-block; background: #ffffff; padding: 0 0.75rem; color: #6b7280; font-size: .95rem; }
      .login-footer { text-align: center; margin-top: 0.9rem; color: #94a3b8; font-size: .9rem; }
    </style>
  </head>
  <body>
    <div class="login-page">
      <div class="card login-card">
        <div class="card-body">
          <div class="login-brand">
            <h4>BRAC Portal</h4>
            <p>Student Grade Management</p>
          </div>

          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label for="id_username" class="form-label">Username</label>
              <input type="text" class="form-control" id="id_username" name="username" placeholder="Enter your username" required>
            </div>

            <div class="mb-3">
              <label for="id_password" class="form-label">Password</label>
              <input type="password" class="form-control" id="id_password" name="password" placeholder="Enter your password" required>
            </div>

            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="id_remember" name="remember">
              <label class="form-check-label" for="id_remember">Remember me</label>
              <a href="/accounts/password/reset/" class="float-end forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary w-100">Sign In</button>
          </form>

          <div class="login-divider"><span>Or use a third-party</span></div>

          <!-- Google Sign In — href uses allauth's URL -->
          <a href="{% url 'google_login' %}" class="btn btn-google w-100">
            <!-- Official Google G colour SVG -->
            <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Sign in with Google
          </a>

          <div class="login-footer">
            Don't have an account? <a href="/accounts/signup/" style="color: #2563eb;">Sign up</a>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
