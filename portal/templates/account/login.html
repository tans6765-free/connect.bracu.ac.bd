{% load account %}
{% load socialaccount %}

<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; }
      .login-container { max-width: 400px; width: 100%; }
      .card { border: none; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
      .card-body { padding: 40px; }
      .btn-primary { background: #667eea; border: none; border-radius: 10px; padding: 10px; font-weight: 600; }
      .btn-primary:hover { background: #764ba2; }
    </style>
  </head>
  <body>
    <div class="login-container mx-auto">
      <div class="card">
        <div class="card-body">
          <h2 class="text-center mb-30 mb-4">BRAC Portal</h2>
          
          {% if form.non_field_errors %}
            <div class="alert alert-danger">{{ form.non_field_errors }}</div>
          {% endif %}

          <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
              <label for="id_login" class="form-label">Username</label>
              <input type="text" class="form-control" name="login" id="id_login" required>
            </div>
            <div class="mb-3">
              <label for="id_password" class="form-label">Password</label>
              <input type="password" class="form-control" name="password" id="id_password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3">Sign In</button>
          </form>

          <hr>
          
          <a href="{% provider_login_url 'google' %}" class="btn btn-light w-100">Sign in with Google</a>
        </div>
      </div>
    </div>
  </body>
</html>
