{% load account socialaccount static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BracU Central Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #f8fafc;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }
        .branding {
            text-align: center;
            padding: 2rem 2rem 1.5rem;
            background: linear-gradient(135deg, #f8fafc, #ffffff);
        }
        .branding img {
            width: 120px;
            height: auto;
            margin-bottom: 12px;
        }
        .branding h1 {
            font-size: 1.55rem;
            font-weight: 700;
            color: #1e2937;
            margin: 0;
        }
        .form-area {
            padding: 0 2rem 2.5rem;
        }
        .form-group {
            margin-bottom: 1.4rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #374151;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            font-size: 1rem;
        }
        .btn-signin {
            width: 100%;
            background: #3154f0;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
        }
        .divider {
            text-align: center;
            margin: 1.5rem 0;
            color: #6b7280;
            position: relative;
        }
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e5e7eb;
        }
        .divider span {
            background: white;
            padding: 0 20px;
        }
        .google-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: white;
            font-size: 1rem;
            font-weight: 500;
            color: #374151;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="branding">
            <img src="{% static 'images/brac-logo.png' %}" alt="BRAC University">
            <h1>BracU Central Login</h1>
        </div>

        <div class="form-area">
            <h2 style="text-align:center; margin-bottom:1.8rem; font-size:1.3rem;">Sign in to your account</h2>

            {% if messages %}
                {% for message in messages %}
                    <div style="background:#fee2e2;color:#b91c1c;padding:12px;border-radius:8px;margin-bottom:1rem;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post" action="{% url 'account_login' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label>Username or email</label>
                    <input type="text" name="login" placeholder="Enter username or email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn-signin">Sign In</button>
            </form>

            <div class="divider"><span>Or sign in with</span></div>

            {% if google_client_id %}
                <a href="{% provider_login_url 'google' process='login' %}" class="google-btn">
                    <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" width="18" height="18">
                    Continue with Google
                </a>
            {% endif %}
        </div>
    </div>
</body>
</html>
