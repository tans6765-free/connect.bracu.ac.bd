<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page_title }}</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body class="login-body">
    <div class="login-shell">
      <div class="login-card google-login-card">
        <div class="google-topbar">
          <img src="/static/images/brac-logo.svg" class="google-logo" alt="BRAC" />
          <div class="google-service">BRAC Student Lifecycle Management</div>
        </div>
        <h1>Sign in</h1>
        <p class="google-subtitle">Use your Google Account</p>
        <a class="google-button" href="{{ auth_route }}">
          <span class="google-icon">
            <svg viewBox="0 0 46 46" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <path id="gpath" d="M44.5 20H24v6h11.3c-1.2 4-4.1 7.3-7.9 9.2l12 9.3C42.6 36.4 46 29 46 20c0-1.3-.1-2.6-.4-3.8zM24 46c6.5 0 11.9-2.1 15.8-5.7l-12-9.3C25.8 31 25 31.3 24 31.3c-8.7 0-16-7.4-16-16.5S15.3-1.7 24-1.7c4.1 0 7.8 1.5 10.6 4.4l8-8C35.1-7.7 29.9-9.7 24-9.7 11.6-9.7 1.3 1 1.3 13.5S11.6 36.7 24 36.7c9.3 0 17.1-6.1 19.9-14.3H24v-6h20.5c.2 1.2.3 2.4.3 3.6 0 6.8-2.3 12.9-6.4 17.9-1.2 1.4-2.6 2.6-4.1 3.6L24 46z"/>
              </defs>
              <use href="#gpath" fill="#4285F4" />
            </svg>
          </span>
          <span>Continue with Google</span>
        </a>
        <div class="account-card">
          <div class="account-icon">M</div>
          <div class="account-details">
            <div class="account-name">Md. Tahsinul Islam</div>
            <div class="account-email">md.tahsinul.islam@g.bracu.ac.bd</div>
          </div>
        </div>
        <p class="login-note">
          Not your computer? Use Guest mode to sign in privately. <a href="#">Learn more</a>
        </p>
        <p class="google-footer">
          <a href="#">Privacy</a> · <a href="#">Terms</a>
        </p>
      </div>
    </div>
  </body>
</html>
