<!DOCTYPE html>

        <rect x="80" y="485" width="20" height="20" stroke="#c8cfd9" stroke-width="1" fill="none"/>
        <rect x="115" y="485" width="20" height="20" stroke="#c8cfd9" stroke-width="1" fill="none"/>

        <line x1="100" y1="648" x2="90" y2="658" stroke="#c8cfd9" stroke-width="1"/>
        <line x1="100" y1="648" x2="110" y2="658" stroke="#c8cfd9" stroke-width="1"/>

        <line x1="100" y1="665" x2="108" y2="678" stroke="#c8cfd9" stroke-width="1"/>
        <!-- Person 2 -->

        <line x1="240" y1="641" x2="230" y2="651" stroke="#c8cfd9" stroke-width="1"/>

        <!-- Dashed road -->
        <line x1="0" y1="695" x2="420" y2="695" stroke="#c8cfd9" stroke-width="1" stroke-dasharray="8 6"/>

        <!-- Book doodle -->
        <rect x="300" y="200" width="50" height="40" rx="2" stroke="#c8cfd9" stroke-width="1" fill="none"/>
        <line x1="325" y1="200" x2="325" y2="240" stroke="#c8cfd9" stroke-width="0.8"/>
        <line x1="308" y1="212" x2="322" y2="212" stroke="#c8cfd9" stroke-width="0.8"/>
        <line x1="308" y1="220" x2="322" y2="220" stroke="#c8cfd9" stroke-width="0.8"/>
        <line x1="308" y1="228" x2="322" y2="228" stroke="#c8cfd9" stroke-width="0.8"/>
        <!-- Bus sketch -->
        <rect x="320" y="695" width="100" height="40" rx="6" stroke="#c8cfd9" stroke-width="1" fill="none"/>
        <rect x="328" y="703" width="18" height="14" rx="1" stroke="#c8cfd9" stroke-width="0.8" fill="none"/>
        <rect x="352" y="703" width="18" height="14" rx="1" stroke="#c8cfd9" stroke-width="0.8" fill="none"/>
        <rect x="376" y="703" width="18" height="14" rx="1" stroke="#c8cfd9" stroke-width="0.8" fill="none"/>
        <circle cx="338" cy="735" r="6" stroke="#c8cfd9" stroke-width="1" fill="none"/>
        <circle cx="400" cy="735" r="6" stroke="#c8cfd9" stroke-width="1" fill="none"/>
      </svg>
    </div>

    <!-- LOGIN CARD -->
    <div class="login-shell">
      <div class="login-top">
        <img src="/static/images/brac-logo.png" class="login-logo" alt="BRAC University" />
        <div class="login-top-divider"></div>
        <div class="login-brand-title">BracU Central Login</div>
      </div>

      <div class="login-card">
        <h1 class="login-h1">Sign in to your account</h1>

        {% if error %}
          <div class="form-error">{{ error }}</div>
        {% endif %}

        <form class="login-form" method="post" action="/login">
          <input type="hidden" name="next" value="{{ request.args.get('next', '') }}" />
          <div class="form-field">
            <label>Username or email<span class="required">*</span></label>
            <input type="text" name="username" value="{{ username|default('') }}" placeholder="Enter username or email" class="text-input" />
          </div>

          <div class="form-field">
            <label>Password</label>
            <div class="pw-wrap">
              <input type="password" name="password" placeholder="Enter your password" id="pwInput" class="text-input" />
              <button type="button" class="pw-toggle" onclick="togglePw()" tabindex="-1">
                <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="recaptcha-box">
            <label class="recaptcha-check">
              <input type="checkbox" name="robotCheck" id="robotCheck" onchange="onRobotCheck()" />
              <span class="check-box-visual"></span>
              <span>I'm not a robot</span>
            </label>
            <div class="recaptcha-right">
              <svg viewBox="0 0 64 64" width="36" height="36" fill="none">
                <path d="M32 4C16.536 4 4 16.536 4 32s12.536 28 28 28 28-12.536 28-28S47.464 4 32 4z" stroke="#c8cfd9" stroke-width="2"/>
                <path d="M22 32l7 7 13-13" stroke="#4a90d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <div class="recaptcha-label">reCAPTCHA<br/><span>Privacy - Terms</span></div>
            </div>
          </div>

          <div class="form-footer-row">
            <span></span>
            <a href="/forgot-password" class="forgot-link">Forgot Password?</a>
          </div>

          <button type="submit" class="sign-in-btn">Sign In</button>
        </form>

        <div class="divider"><span>Or sign in with</span></div>

        <a class="google-login-btn" href="{{ auth_route }}">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 46 46" width="20" height="20">
            <path fill="#FBBC05" d="M20.66 17.77V29.85H29.82C29.2 33.73 26.05 36.41 21.85 36.41C16.81 36.41 12.6 32.3 12.6 27.22C12.6 22.14 16.81 18.02 21.85 18.02C24.4 18.02 26.68 18.93 28.28 20.43L32.85 15.86C29.92 13.06 26.21 11.5 21.85 11.5C13.52 11.5 6.87 18.16 6.87 26.5C6.87 34.83 13.52 41.5 21.85 41.5C30.18 41.5 36.83 34.83 36.83 26.5C36.83 25.23 36.71 24.03 36.48 22.92H20.66Z"/>
            <path fill="#EA4335" d="M8.52 16.69L13.79 20.17C15.6 16.67 18.74 14.02 22.99 13.1V7.08C17.13 7.95 11.85 11.88 8.52 16.69Z"/>
            <path fill="#34A853" d="M21.85 41.5C26.33 41.5 30.2 39.75 33.07 36.95L28.27 32.85C26.77 34.21 24.56 35.09 21.85 35.09C17.59 35.09 13.97 31.65 13.24 27.56L8.12 31.63C9.68 37.26 15.42 41.5 21.85 41.5Z"/>
            <path fill="#4285F4" d="M36.48 22.92L36.5 22.1H21.85V29.85H29.82C29.31 32.05 27.92 33.95 25.96 35.13L25.9 35.43L30.07 39.25L30.3 39.29C34.52 35.71 36.48 30.71 36.48 26.41C36.48 25.72 36.44 25.05 36.35 24.4L36.48 22.92Z"/>
          </svg>
          <span>Google</span>
        </a>
      </div>
    </div>

    <script>
      function togglePw() {
        const input = document.getElementById('pwInput');
        input.type = input.type === 'password' ? 'text' : 'password';
      }

      function onRobotCheck() {
        // visual feedback only — real reCAPTCHA would go here
      }

      function handleSignIn() {
        // Since fields are disabled, redirect to Google auth
        window.location.href = "{{ auth_route }}";
      }
    </script>
  </body>
</html>
