<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page_title }}</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body class="login-body">
    <div class="login-shell">
      <div class="login-card bracu-login-card">
        <div class="brand-header">
          <img src="/static/images/brac-logo.svg" class="logo-image" alt="BRAC" />
          <div class="brand-title">BracU Central Login</div>
        </div>
        <div class="login-content">
          <h1>Sign in to your account</h1>
          <form class="login-form" action="/accounts/google/auth/" method="get">
            <label>Username or email</label>
            <input type="text" placeholder="Enter username or email" disabled />
            <label>Password</label>
            <input type="password" placeholder="Enter your password" disabled />
            <div class="recaptcha-box">
              <span class="checkbox"></span>
              <span>I'm not a robot</span>
              <span class="recaptcha-badge">reCAPTCHA</span>
            </div>
            <div class="form-footer">
              <a href="#">Forgot Password?</a>
            </div>
            <button type="submit" class="sign-in-button">Sign In</button>
          </form>
          <div class="divider"><span>Or sign in with</span></div>
          <a class="google-login" href="{{ auth_route }}">
            <span class="google-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 46 46" width="18" height="18">
                <path fill="#FBBC05" d="M20.66 17.77V29.85H29.82C29.2 33.73 26.05 36.41 21.85 36.41C16.81 36.41 12.6 32.3 12.6 27.22C12.6 22.14 16.81 18.02 21.85 18.02C24.4 18.02 26.68 18.93 28.28 20.43L32.85 15.86C29.92 13.06 26.21 11.5 21.85 11.5C13.52 11.5 6.87 18.16 6.87 26.5C6.87 34.83 13.52 41.5 21.85 41.5C30.18 41.5 36.83 34.83 36.83 26.5C36.83 25.23 36.71 24.03 36.48 22.92H20.66Z"/>
                <path fill="#EA4335" d="M8.52 16.69L13.79 20.17C15.6 16.67 18.74 14.02 22.99 13.1V7.08C17.13 7.95 11.85 11.88 8.52 16.69Z"/>
                <path fill="#34A853" d="M21.85 41.5C26.33 41.5 30.2 39.75 33.07 36.95L28.27 32.85C26.77 34.21 24.56 35.09 21.85 35.09C17.59 35.09 13.97 31.65 13.24 27.56L8.12 31.63C9.68 37.26 15.42 41.5 21.85 41.5Z"/>
                <path fill="#4285F4" d="M36.48 22.92L36.5 22.1H21.85V29.85H29.82C29.31 32.05 27.92 33.95 25.96 35.13L25.9 35.43L30.07 39.25L30.3 39.29C34.52 35.71 36.48 30.71 36.48 26.41C36.48 25.72 36.44 25.05 36.35 24.4L36.48 22.92Z"/>
              </svg>
            </span>
            <span>Google</span>
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
