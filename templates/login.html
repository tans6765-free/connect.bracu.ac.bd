<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page_title }}</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body class="login-body">
    <div class="login-shell">
      <div class="login-card google-login-card">
        <div class="google-topbar">
          <img src="/static/images/brac-logo.svg" class="google-logo" alt="BRAC" />
          <div class="google-service">BRAC Student Lifecycle Management</div>
        </div>
        <h1>Sign in</h1>
        <p class="google-subtitle">Use your Google Account</p>
        <a class="google-button" href="{{ auth_route }}">
          <span class="google-icon">G</span>
          <span>Continue with Google</span>
        </a>
        <div class="account-card">
          <div class="account-icon">M</div>
          <div class="account-details">
            <div class="account-name">Md. Tahsinul Islam</div>
            <div class="account-email">md.tahsinul.islam@g.bracu.ac.bd</div>
          </div>
        </div>
        <p class="login-note">
          Not your computer? Use Guest mode to sign in privately. <a href="#">Learn more</a>
        </p>
        <p class="google-footer">
          Privacy · Terms
        </p>
      </div>
    </div>
  </body>
</html>
