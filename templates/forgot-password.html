<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page_title }}</title>
    <link rel="icon" href="/static/fav.ico" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body class="login-body">
    <div class="login-bg-sketch" aria-hidden="true">
      <svg class="sketch-svg sketch-left" viewBox="0 0 420 700" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="60" cy="580" rx="30" ry="40" stroke="#c8cfd9" stroke-width="1.2" fill="none"/>
        <line x1="60" y1="620" x2="60" y2="680" stroke="#c8cfd9" stroke-width="1.2"/>
        <rect x="60" y="430" width="220" height="130" stroke="#c8cfd9" stroke-width="1.2" fill="none"/>
      </svg>
      <svg class="sketch-svg sketch-right" viewBox="0 0 420 700" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="370" cy="100" r="28" stroke="#c8cfd9" stroke-width="1" fill="none"/>
        <line x1="342" y1="100" x2="398" y2="100" stroke="#c8cfd9" stroke-width="0.8"/>
      </svg>
    </div>

    <div class="login-shell">
      <div class="login-top">
        <img src="/static/images/brac-logo.png" class="login-logo" alt="BRAC University" />
        <div class="login-top-divider"></div>
        <div class="login-brand-title">Forgot Password</div>
      </div>

      <div class="login-card">
        <h1 class="login-h1">Reset your account password</h1>
        <p class="subtle-text">Enter the email address associated with your BRAC account and we’ll send a reset link.</p>
        {% if message %}
          <div class="form-message">{{ message }}</div>
        {% endif %}

        <form class="login-form" method="post" action="/forgot-password">
          <div class="form-field">
            <label>Email address<span class="required">*</span></label>
            <input type="email" name="email" placeholder="name@bracu.ac.bd" class="text-input" required />
          </div>

          <button type="submit" class="sign-in-btn">Send reset link</button>
        </form>

        <div class="divider"><span>Back to</span></div>
        <a class="google-login-btn" href="/login">
          <span>Sign in</span>
        </a>
      </div>
    </div>
  </body>
</html>
